services:
  - type: web
    name: kraken-live-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LIVE_TRADING
        value: "false"
      - key: AUTONOMOUS_ENABLED
        value: "false"
      - key: MIN_EDGE_MULTIPLE
        value: "2.0"
      - key: STOP_LOSS_PCT
        value: "1.5"
      - key: TAKE_PROFIT_PCT
        value: "3.0"
      - key: DAILY_LOSS_LIMIT
        value: "25"
      - key: TREND_FILTER_ENABLED
        value: "true"
      - key: TREND_FILTER_DAYS
        value: "100"
      - key: ML_ENABLED
        value: "false"
      - key: ML_PAPER_MODE
        value: "true"
      - key: ML_KILL_SWITCH
        value: "false"
      - key: PAUSED
        value: "false"
      - key: KRAKEN_BASE_URL
        value: "https://api.kraken.com"
      - key: KRAKEN_PAIR
        value: "XBTUSD"
      - key: KRAKEN_API_KEY
        sync: false
      - key: KRAKEN_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
